<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14243b"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle for PWA icon -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Ornate Islamic Octagon Frame -->
  <g transform="translate(256, 256) scale(0.92)" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.35">
    <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113"/>
    <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113" transform="rotate(22.5)"/>
  </g>

  <!-- Crescent Moon -->
  <path d="M 285 130 C 235 140 195 185 195 240 C 195 305 248 358 313 358 C 342 358 368 347 388 330 C 320 370 235 340 215 260 C 205 220 225 165 285 130 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Star -->
  <polygon points="325,185 330,198 343,200 333,209 336,222 325,215 314,222 317,209 307,200 320,198" fill="url(#goldGrad)"/>

  <!-- Open Quran Symbol at bottom -->
  <path d="M 180 370 Q 256 345 256 375 Q 256 345 332 370 L 332 395 Q 256 370 256 400 Q 256 370 180 395 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <line x1="256" y1="375" x2="256" y2="400" stroke="#070d18" stroke-width="2"/>
</svg>
