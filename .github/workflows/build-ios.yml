name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Mobile
        run: npm run build:mobile

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ZadMuslim-Android.apk
          echo "ZadMuslim-Android.apk successfully created!"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZadMuslim-Android-APK
          path: ZadMuslim-Android.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Mobile
        run: npm run build:mobile

      - name: Patch Swift Types for Capacitor Local Notifications
        run: node scripts/patch-swift.js

      - name: Configure Xcode Project for Unsigned CI Build
        run: |
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj || true

      - name: Create iOS Archive (xcodebuild archive)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
              echo "=========================================="
              echo "🚨 EXTRACTED XCODEBUILD COMPILATION ERRORS:"
              echo "=========================================="
              grep -E "error: |fatal error: " xcodebuild.log || tail -n 60 xcodebuild.log
              echo "=========================================="
              exit 1
            }

      - name: Package Payload into ZadMuslim-iOS.ipa
        run: |
          mkdir -p Payload
          APP_PATH="build/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: App.app was not found in archive!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr ZadMuslim-iOS.ipa Payload
          echo "ZadMuslim-iOS.ipa successfully created!"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZadMuslim-iOS-IPA
          path: ZadMuslim-iOS.ipa
          retention-days: 14

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ZadMuslim-Android-APK
          path: release-files
        continue-on-error: true

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ZadMuslim-iOS-IPA
          path: release-files
        continue-on-error: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.6.0"
          name: "زاد المسلم v3.6.0 (Android & iOS)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 تطبيق زاد المسلم (الإصدار الشامل v3.6.0)
            تطبيق إسلامي شامل وصدقة جارية.

            ---

            ### 🤖 روابط تحميل الأندرويد (Android):
            - **تحميل مباشر لملف APK:** [اضغط هنا لتحميل ZadMuslim-Android.apk](https://github.com/AbdoMohaamed/zadmuslim/releases/latest/download/ZadMuslim-Android.apk)
            - **طريقة التثبيت:** حمّل الملف وافتحه مباشرة على هاتفك لتثبيته.

            ---

            ### 🍏 روابط تحميل الآيفون (iOS):
            - **تحميل مباشر لملف IPA:** [اضغط هنا لتحميل ZadMuslim-iOS.ipa](https://github.com/AbdoMohaamed/zadmuslim/releases/latest/download/ZadMuslim-iOS.ipa)
            - **طريقة التثبيت:** حمّل الملف واستخدم أداة **3uTools** (عبر Toolbox ⬅️ IPA Signature) أو تطبيق **Sideloadly** لتوقيع وتثبيت التطبيق بحسابك مجاناً.
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
