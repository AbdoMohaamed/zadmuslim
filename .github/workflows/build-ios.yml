name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      ios_test_only:
        description: Build an unsigned iOS test IPA without publishing a release
        type: boolean
        default: false

jobs:
  build-android:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.ios_test_only }}
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
    env:
      ZAD_KEYSTORE_PASSWORD: ${{ secrets.ZAD_KEYSTORE_PASSWORD }}
      ZAD_KEY_ALIAS: ${{ secrets.ZAD_KEY_ALIAS }}
      ZAD_KEY_PASSWORD: ${{ secrets.ZAD_KEY_PASSWORD }}
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Provision Gradle 8.14.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/gradle
          curl -sL -H "Accept: application/octet-stream" -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/269969095" -o /tmp/gradle/gradle-8.14.3-bin.zip
          sed -i 's|distributionUrl=.*|distributionUrl=file\\:///tmp/gradle/gradle-8.14.3-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Mobile
        run: npm run build:mobile

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Check release signing configuration
        id: signing
        env:
          ZAD_KEYSTORE_BASE64: ${{ secrets.ZAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ZAD_KEYSTORE_BASE64" ] && [ -n "$ZAD_KEYSTORE_PASSWORD" ] && [ -n "$ZAD_KEY_ALIAS" ] && [ -n "$ZAD_KEY_PASSWORD" ]; then
            printf '%s' "$ZAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zadmuslim-release.jks"
            echo "ZAD_KEYSTORE_PATH=$RUNNER_TEMP/zadmuslim-release.jks" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets are unavailable; only a debug artifact will be built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android Release AAB & APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Build Android debug APK without release signing
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android debug artifact
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZadMuslim-Android-v3.6.25-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          compression-level: 0

      - name: Prepare Android Release Files
        if: steps.signing.outputs.ready == 'true'
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab ZadMuslim-Android.aab
          cp android/app/build/outputs/apk/release/app-release.apk ZadMuslim-Android.apk
          echo "ZadMuslim-Android.aab and ZadMuslim-Android.apk successfully created!"

      - name: Upload Android AAB to GitHub Artifacts (Optional)
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ZadMuslim-Android-AAB
          path: ZadMuslim-Android.aab
          retention-days: 1
          compression-level: 0

      - name: Upload Android APK to GitHub Artifacts (Optional)
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ZadMuslim-Android-APK
          path: ZadMuslim-Android.apk
          retention-days: 1
          compression-level: 0

      - name: Prepare Android Debug Files
        if: steps.signing.outputs.ready != 'true'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZadMuslim-Android.apk
          echo "ZadMuslim-Android.apk successfully created from debug build!"

      - name: Publish Android Apps to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.6.25"
          name: "زاد المسلم v3.6.25 (Android & iOS)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 تطبيق زاد المسلم (الإصدار الشامل v3.6.25)
            تطبيق إسلامي شامل وصدقة جارية.

            ---

            ### 🤖 روابط تحميل الأندرويد (Android):
            - **تحميل مباشر لملف APK:** [اضغط هنا لتحميل ZadMuslim-Android.apk](https://github.com/AbdoMohaamed/zadmuslim/releases/latest/download/ZadMuslim-Android.apk)
            - **طريقة التثبيت:** حمّل الملف وافتحه مباشرة على هاتفك لتثبيته.

            ---

            ### 🍏 روابط تحميل الآيفون (iOS):
            - **تحميل مباشر لملف IPA:** [اضغط هنا لتحميل ZadMuslim-iOS.ipa](https://github.com/AbdoMohaamed/zadmuslim/releases/latest/download/ZadMuslim-iOS.ipa)
            - **طريقة التثبيت:** حمّل الملف واستخدم أداة **3uTools** (عبر Toolbox ⬅️ IPA Signature) أو تطبيق **Sideloadly** لتوقيع وتثبيت التطبيق بحسابك مجاناً.
          files: |
            ZadMuslim-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Mobile
        run: npm run build:mobile

      - name: Prepare Local iOS Frameworks (Bypass GitHub Releases CDN 504)
        run: node scripts/prepare-ios-frameworks.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Swift Types for Capacitor Local Notifications
        run: node scripts/patch-swift.js

      - name: Configure Xcode Project for Unsigned CI Build
        run: |
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj || true

      - name: Create iOS Archive (xcodebuild archive)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
              echo "=========================================="
              echo "🚨 EXTRACTED XCODEBUILD COMPILATION ERRORS:"
              echo "=========================================="
              grep -E "error: |fatal error: " xcodebuild.log || tail -n 60 xcodebuild.log
              echo "=========================================="
              exit 1
            }

      - name: Package Payload into ZadMuslim-iOS.ipa
        run: |
          mkdir -p Payload
          APP_PATH="build/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: App.app was not found in archive!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"
          for sound in adhan_abdulbasit adhan_aqsa adhan_madinah adhan_makkah adhan_qatami adhan_refaat pre_asr pre_dhuhr pre_fajr pre_isha pre_maghrib; do
            if [ ! -s "$APP_PATH/$sound.caf" ]; then
              echo "Error: Missing notification sound $sound.caf"
              exit 1
            fi
          done
          cp -r "$APP_PATH" Payload/
          zip -qr ZadMuslim-iOS.ipa Payload
          echo "ZadMuslim-iOS.ipa successfully created!"

      - name: Upload IPA to GitHub Artifacts (Optional)
        uses: actions/upload-artifact@v4
        continue-on-error: ${{ !inputs.ios_test_only }}
        with:
          name: ZadMuslim-iOS-IPA
          path: ZadMuslim-iOS.ipa
          retention-days: 1
          compression-level: 0

      - name: Publish iOS App to GitHub Releases
        if: ${{ success() && !inputs.ios_test_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.6.25"
          name: "زاد المسلم v3.6.25 (Android & iOS)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 تطبيق زاد المسلم (الإصدار الشامل v3.6.25)
            تطبيق إسلامي شامل وصدقة جارية.

            ---

            ### 🤖 روابط تحميل الأندرويد (Android):
            - **تحميل مباشر لملف APK:** [اضغط هنا لتحميل ZadMuslim-Android.apk](https://github.com/AbdoMohaamed/zadmuslim/releases/latest/download/ZadMuslim-Android.apk)
            - **طريقة التثبيت:** حمّل الملف وافتحه مباشرة على هاتفك لتثبيته.

            ---

            ### 🍏 روابط تحميل الآيفون (iOS):
            - **تحميل مباشر لملف IPA:** [اضغط هنا لتحميل ZadMuslim-iOS.ipa](https://github.com/AbdoMohaamed/zadmuslim/releases/latest/download/ZadMuslim-iOS.ipa)
            - **طريقة التثبيت:** حمّل الملف واستخدم أداة **3uTools** (عبر Toolbox ⬅️ IPA Signature) أو تطبيق **Sideloadly** لتوقيع وتثبيت التطبيق بحسابك مجاناً.
          files: |
            ZadMuslim-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
