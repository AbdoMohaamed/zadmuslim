name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Mobile
        run: npm run build:mobile

      - name: Patch Swift Types for Capacitor Local Notifications
        run: node scripts/patch-swift.js

      - name: Configure Xcode Project for Unsigned CI Build
        run: |
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj || true

      - name: Create iOS Archive (xcodebuild archive)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
              echo "=========================================="
              echo "🚨 EXTRACTED XCODEBUILD COMPILATION ERRORS:"
              echo "=========================================="
              grep -E "error: |fatal error: " xcodebuild.log || tail -n 60 xcodebuild.log
              echo "=========================================="
              exit 1
            }

      - name: Package Payload into ZadMuslim-iOS.ipa
        run: |
          mkdir -p Payload
          APP_PATH="build/App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: App.app was not found in archive!"
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr ZadMuslim-iOS.ipa Payload
          echo "ZadMuslim-iOS.ipa successfully created!"

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZadMuslim-iOS-IPA
          path: ZadMuslim-iOS.ipa
          retention-days: 14

      - name: Publish ZadMuslim-iOS.ipa to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.6.0"
          name: "تطبيق زاد المسلم v3.6.0"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 تطبيق زاد المسلم (نسخة iOS - ملف IPA)
            تطبيق إسلامي شامل وصدقة جارية.

            ### 📥 رابط التحميل المباشر للآيفون:
            يمكنك تحميل ملف **`ZadMuslim-iOS.ipa`** مباشرة من قائمة المرفقات (Assets) في الأسفل.

            ### 🛠️ طريقة التثبيت على الآيفون:
            1. قم بتحميل ملف **`ZadMuslim-iOS.ipa`**.
            2. استخدم أداة **3uTools** (عبر Toolbox ⬅️ IPA Signature) أو برنامج **Sideloadly** لتوقيع وتثبيت التطبيق بحساب Apple ID الخاص بك مجاناً.
            3. من إعدادات الآيفون: **عام** ⬅️ **إدارة VPN والجهاز** ⬅️ اضغط على حسابك واضغط **وثوق (Trust)**.
          files: ZadMuslim-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

