name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  RELEASE_TAG: v3.6.0-build.${{ github.run_number }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$RELEASE_TAG" \
              --json isDraft --jq '.isDraft')

            if [ "$IS_DRAFT" != "true" ]; then
              echo "This release is already published. Start a new workflow run."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "زاد المسلم v3.6.0 — Build $GITHUB_RUN_NUMBER" \
              --notes "جارٍ تجهيز ملفات Android وiOS." \
              --draft
          fi

  build-android:
    name: Build Android APK & AAB
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Mobile
        run: npm run build:mobile

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release AAB & APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Prepare Android Release Files
        run: |
          set -euo pipefail

          cp android/app/build/outputs/bundle/release/app-release.aab \
            ZadMuslim-Android.aab

          cp android/app/build/outputs/apk/release/app-release.apk \
            ZadMuslim-Android.apk

          test -s ZadMuslim-Android.aab
          test -s ZadMuslim-Android.apk

      - name: Upload Android Files Directly to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            ZadMuslim-Android.aab \
            ZadMuslim-Android.apk \
            --clobber

  build-ios:
    name: Build iOS IPA
    needs: prepare-release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Mobile
        run: npm run build:mobile

      - name: Patch Swift Types for Capacitor Local Notifications
        run: node scripts/patch-swift.js

      - name: Configure Xcode Project for Unsigned CI Build
        run: |
          sed -i '' \
            's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' \
            ios/App/App.xcodeproj/project.pbxproj

      - name: Create iOS Archive
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log || {
              echo "XCODEBUILD COMPILATION ERRORS:"
              grep -E "error: |fatal error: " xcodebuild.log \
                || tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="build/App.xcarchive/Products/Applications/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App.app was not found in archive!"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ZadMuslim-iOS.ipa Payload

          test -s ZadMuslim-iOS.ipa

      - name: Upload IPA Directly to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            ZadMuslim-iOS.ipa \
            --clobber

  publish-release:
    name: Publish Completed Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify Release Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --json assets \
            --jq '.assets[].name' > release-assets.txt

          for FILE in \
            ZadMuslim-Android.apk \
            ZadMuslim-Android.aab \
            ZadMuslim-iOS.ipa
          do
            if ! grep -Fxq "$FILE" release-assets.txt; then
              echo "Missing release file: $FILE"
              exit 1
            fi
          done

      - name: Publish Release and Mark as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          ## 📱 تطبيق زاد المسلم v3.6.0
          تطبيق إسلامي شامل وصدقة جارية.

          ### 🤖 Android
          - [تحميل APK](https://github.com/${GH_REPO}/releases/latest/download/ZadMuslim-Android.apk)
          - [تحميل AAB لرفعه إلى Google Play](https://github.com/${GH_REPO}/releases/latest/download/ZadMuslim-Android.aab)

          ### 🍏 iOS
          - [تحميل IPA](https://github.com/${GH_REPO}/releases/latest/download/ZadMuslim-iOS.ipa)
          - ملف IPA غير موقّع، ويحتاج إلى التوقيع قبل التثبيت.

          ---
          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}
          EOF

          gh release edit "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft=false \
            --latest
